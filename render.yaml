services:
  - type: web
    name: boardbazaar
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: boardbazaar-db
          property: connectionString

databases:
  - name: boardbazaar-db
    plan: free
